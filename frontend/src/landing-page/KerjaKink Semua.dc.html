<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"><style>body{margin:0;background:#EAE6F2;font-family:Poppins,system-ui,sans-serif;color:#1B1B1F;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:#606BDF;text-decoration:none}a:hover{color:#4A54B3}input,button,textarea{font-family:inherit}input:focus,textarea:focus{outline:none;border-color:#606BDF}:focus-visible{outline:2px solid #606BDF;outline-offset:2px}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#DFDBE8;border-radius:4px}</style></helmet>

<div style="height:100vh;display:flex;flex-direction:column;overflow:hidden">

<div style="background:#1B1B1F;flex:0 0 auto">
<div style="max-width:1600px;margin:0 auto;padding:11px clamp(12px,2vw,26px);display:flex;align-items:center;gap:16px;flex-wrap:wrap">
<div style="display:flex;align-items:center;gap:10px;margin-right:auto">
<svg width="28" height="28" viewBox="0 0 30 30" fill="none" style="display:block;flex:0 0 auto" aria-hidden="true"><path d="M6 3.5v23" stroke="#ffffff" stroke-width="4.5"></path><path d="M7.6 15.4 23.6 4.2" stroke="#606BDF" stroke-width="4.5"></path><path d="M7.6 15.4 23.6 26.6" stroke="#ffffff" stroke-width="4.5"></path></svg>
<div style="margin-left:-13px">
<div style="font-size:13.5px;color:#fff;line-height:1.2"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">K</span><span style="font-weight:700">erja</span><span style="font-weight:400">Kink</span><span style="font-weight:500;color:#DFDBE8"> · Portal Bursa Kerja Kampus</span></div>
<div style="font-size:11px;color:#9A9AA1">Semua hasil akhir dalam satu halaman</div>
</div>
</div>
<div style="display:flex;gap:4px;background:rgba(255,255,255,0.08);border-radius:8px;padding:4px;flex-wrap:wrap">
<sc-for list="{{ views }}" as="v" hint-placeholder-count="4">
<button onClick="{{ v.pick }}" style="display:flex;align-items:center;gap:8px;background:{{ v.bg }};color:{{ v.fg }};border:none;padding:8px 14px;border-radius:5px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap">
<span style="width:6px;height:6px;border-radius:50%;background:{{ v.dot }}"></span>{{ v.name }}
</button>
</sc-for>
</div>
</div>
<div style="border-top:1px solid rgba(255,255,255,0.1)">
<div style="max-width:1600px;margin:0 auto;padding:9px clamp(12px,2vw,26px);display:flex;gap:12px;flex-wrap:wrap;align-items:center">
<span style="font-size:11.5px;font-weight:600;color:#fff">{{ current.title }}</span>
<span style="font-size:11.5px;color:#9A9AA1">{{ current.note }}</span>
</div>
</div>
</div>

<div style="flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;background:#EAE6F2">

<sc-if value="{{ isLanding }}" hint-placeholder-val="{{ true }}">
<dc-import name="KerjaKink Landing" hint-size="100%,900px"></dc-import>
</sc-if>

<sc-if value="{{ isPrototype }}">
<dc-import name="KerjaKink Prototype" hint-size="100%,900px"></dc-import>
</sc-if>

<sc-if value="{{ isAdmin }}">
<dc-import name="KerjaKink Admin BKK" hint-size="100%,900px"></dc-import>
</sc-if>

<sc-if value="{{ isAdminMobile }}">
<dc-import name="KerjaKink Admin BKK Mobile" hint-size="100%,900px"></dc-import>
</sc-if>

</div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
const VIEWS = [
  { id: "landing", name: "Landing Page", title: "Landing Page Publik", note: "Responsif desktop & mobile · ilustrasi statis · CTA daftar Pelamar / HRD" },
  { id: "prototype", name: "Prototipe Interaktif", title: "Prototipe Pelamar · HRD · Admin", note: "Toggle Desktop / Mobile / Side-by-Side · satu state dibagi dua frame" },
  { id: "admin", name: "Konsol Admin BKK", title: "Konsol Admin BKK (Desktop)", note: "Data perusahaan, mahasiswa & pelamar, verifikasi, tracer study, pengaturan" },
  { id: "adminMobile", name: "Admin BKK Mobile", title: "Konsol Admin BKK (Mobile)", note: "Frame 390 × 780 · tabel jadi kartu · navigasi bawah 5 tab" }
];

class Component extends DCLogic {
  state = { view: "landing" };

  renderVals() {
    const v = this.state.view;
    return {
      views: VIEWS.map(x => ({
        name: x.name, pick: () => this.setState({ view: x.id }),
        bg: v === x.id ? "#606BDF" : "transparent",
        fg: v === x.id ? "#ffffff" : "#DFDBE8",
        dot: v === x.id ? "#ffffff" : "#9A9AA1"
      })),
      current: VIEWS.find(x => x.id === v),
      isLanding: v === "landing", isPrototype: v === "prototype",
      isAdmin: v === "admin", isAdminMobile: v === "adminMobile"
    };
  }
}

</script>
</body>
</html>
